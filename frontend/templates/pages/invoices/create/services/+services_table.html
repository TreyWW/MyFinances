<div class="input_card max-w-full min-w-full">
    <div class="card-body" data-card="services_card_body">
        <div class="flex py-4 gap-x-3">
            <div class="dropdown w-1/3">
                <div tabindex="0" role="button" class="btn btn-primary w-full">Existing Service</div>
                <ul tabindex="0"
                    class="dropdown-content z-[1] menu p-8 shadow bg-base-200 rounded-box w-full min-w-full">
                    <div class="flex flex-row gap-2">
                        <input placeholder="🔎 Search"
                               type="text"
                               name="search_existing_service"
                               class="input input-bordered w-full flex-1"
                               hx-get="{% url 'api:finance:products:fetch' %}"
                               hx-target="#search_existing_products_items"
                               hx-trigger="keyup changed delay:500ms,load"
                               hx-indicator="#search_loading">
                        <button onclick="modal_create_invoice_product.showModal();"
                                class="btn btn-primary w-12.25"
                                hx-trigger="click once"
                                hx-swap="beforeend"
                                hx-target="#modal_container"
                                hx-get="{% url "api:base:modal retrieve" modal_name="create_invoice_product" %}">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                    <div class="divider">ITEMS (search for > 5)</div>
                    <span id="search_loading"
                          class="loading loading-spinner loading-htmx-loader-individual"></span>
                    <div id="search_existing_products_items"></div>
                </ul>
            </div>
            <button onclick="modal_invoices_add_service.showModal();"
                    class="btn btn-primary w-2/3"
                    hx-trigger="click once"
                    hx-swap="beforeend"
                    hx-target="#modal_container"
                    hx-get="{% url "api:base:modal retrieve" modal_name="invoices_add_service" %}">
                Add New Service
            </button>
        </div>
        <div class="flex w-full overflow-x-auto">
            <table class="table table-zebra max-w-full" id="services_table">
                <thead>
                    <tr>
                        <th>Service</th>
                        <th>Quantity</th>
                        <th>Rate</th>
                        <th>Total Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="services_table_body"
                        data-currency-symbol="{{ currency_symbol }}"
                       _="on every htmx:afterRequest in closest .card-body log 'hi'">
                    {% include 'pages/invoices/create/services/_services_table_body.html' %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
(function () {
    const tbody = document.getElementById("services_table_body");

    if (!tbody || tbody.dataset.editHandlerInstalled) {
        return;
    }

    tbody.dataset.editHandlerInstalled = "true";

    function updateRow(row) {
        const name = row.querySelector('[data-field="name"]');
        const description = row.querySelector('[data-field="description"]');
        const hours = row.querySelector('[data-field="hours"]');
        const rate = row.querySelector('[data-field="rate"]');

        row.querySelector('input[name="service_name[]"]').value = name.value;
        row.querySelector('input[name="service_description[]"]').value = description.value;
        row.querySelector('input[name="hours[]"]').value = hours.value;
        row.querySelector('input[name="price_per_hour[]"]').value = rate.value;

        row.querySelector(".service-name").textContent = name.value;
        row.querySelector(".service-description").textContent = description.value;

        const parsedHours = parseFloat(hours.value);
        const parsedRate = parseFloat(rate.value);

        const total =
            (Number.isFinite(parsedHours) ? parsedHours : 0) *
            (Number.isFinite(parsedRate) ? parsedRate : 0);

        const currencySymbol = tbody.dataset.currencySymbol || "";

        row.querySelector(".service-hours").textContent = hours.value;

        row.querySelector(".service-rate").textContent =
            currencySymbol + rate.value;

        row.querySelector(".service-total").textContent =
            currencySymbol + total.toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });

        row.querySelector('input[name="total_price[]"]').value =
            total.toFixed(2);
    }

    function closeEditor(row) {
        updateRow(row);

        row.querySelectorAll(".service-editor").forEach(function (element) {
            element.classList.add("hidden");
        });

        row.querySelectorAll(".service-display").forEach(function (element) {
            element.classList.remove("hidden");
        });

        const button = row.querySelector(".service-edit-button");

        button.innerHTML =
            '<i class="fa-solid fa-pen-to-square pe-1"></i> Edit';

        button.setAttribute("aria-label", "Edit service");
        row.dataset.editing = "false";
    }

    function openEditor(row) {
        row.querySelectorAll(".service-display").forEach(function (element) {
            element.classList.add("hidden");
        });

        row.querySelectorAll(".service-editor").forEach(function (element) {
            element.classList.remove("hidden");
        });

        const button = row.querySelector(".service-edit-button");

        button.textContent = "Done";
        button.setAttribute("aria-label", "Finish editing service");
        row.dataset.editing = "true";
    }

    tbody.addEventListener("click", function (event) {
        const button = event.target.closest(".service-edit-button");

        if (!button) {
            return;
        }

        const row = button.closest(".invoice-service-row");

        if (!row) {
            return;
        }

        if (row.dataset.editing === "true") {
            closeEditor(row);
            return;
        }

        const activeRow = tbody.querySelector(
            '.invoice-service-row[data-editing="true"]'
        );

        if (activeRow && activeRow !== row) {
            closeEditor(activeRow);
        }

        openEditor(row);
    });

    tbody.addEventListener("input", function (event) {
        const row = event.target.closest(".invoice-service-row");

        if (!row || row.dataset.editing !== "true") {
            return;
        }

        updateRow(row);
    });

    const form = tbody.closest("form");

    if (form) {
        form.addEventListener("submit", function () {
            tbody.querySelectorAll(".invoice-service-row").forEach(updateRow);
        });
    }
})();
</script>
